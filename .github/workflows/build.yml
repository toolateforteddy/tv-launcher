name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test and home APKs
        run: ./gradlew --no-daemon assemblePreviewRelease assembleHomeRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/preview/release/app-preview-release.apk out/tv-launcher-test.apk
          cp app/build/outputs/apk/home/release/app-home-release.apk out/tv-launcher-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      # Every push to main refreshes the "latest" release, so the newest APKs
      # always live at a fixed download link.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          files: out/*.apk
